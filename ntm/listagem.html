<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios - <span id="tituloDisciplina"></span></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Times New Roman', Times, serif; background-color: #f0f2f5; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Times New Roman', Times, serif; font-weight: 600; }
        .badge { font-size: 0.75em; font-weight: 700; padding: 0.35em 0.65em; border-radius: 0.375rem; }
        .card-footer .btn { background-color: #2c3e50; color: #fff; }
        .card-footer .btn:hover { background-color: #1a252f; color: #fff; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center pb-4 mb-4 border-bottom">
            <h1 class="fw-semibold" id="cabecalhoPrincipal">
                <i id="iconeDisciplina" class="me-2"></i><span id="nomeDisciplina" class="ms-2"></span>
            </h1>
            <p style="color: #2c3e50;" id="subtituloDisciplina"></p>
        </div>
        <div class="alert alert-secondary mb-4" id="estatisticas">Carregando...</div>
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="busca" class="form-control" placeholder="Buscar exercício...">
                    </div>
                    <div class="col-md-4">
                        <select id="filtroTrimestre" class="form-select">
                            <option value="todos">Todos os Trimestres</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select id="filtroNivel" class="form-select">
                            <option value="todos">Todos os Níveis</option>
                            <option value="Iniciante">Iniciante</option>
                            <option value="Intermediário">Intermediário</option>
                            <option value="Avançado">Avançado</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" id="listaExercicios">
            <div class="col-12 text-center py-5">
                <div class="spinner-border"></div>
            </div>
        </div>
    </div>
    <script>
        let exerciciosData = [];
        let disciplinaAtual = '';

        // Configurações visuais por disciplina
        const configDisciplina = {
            'Microsoft Excel': { 
                cor: '#1d7240', 
                icone: 'fa-file-excel', 
                nome: 'Microsoft Excel 2016', 
                subtitulo: 'Planilhas, fórmulas e análise de dados',
                arquivo: 'exercicios_microsoft_excel.json'
            },
            'Microsoft Word': { 
                cor: '#2b5797', 
                icone: 'fa-file-word', 
                nome: 'Microsoft Word 2016', 
                subtitulo: 'Edição e formatação de documentos',
                arquivo: 'exercicios_microsoft_word.json'
            },
            'Microsoft PowerPoint': { 
                cor: '#d35230', 
                icone: 'fa-file-powerpoint', 
                nome: 'Microsoft PowerPoint 2016', 
                subtitulo: 'Criação de apresentações profissionais',
                arquivo: 'exercicios_microsoft_powerpoint.json'
            },
            'Microsoft Windows': { 
                cor: '#0078D4', 
                icone: 'fa-window-restore', 
                nome: 'Microsoft Windows 11', 
                subtitulo: 'Gerenciamento do sistema operacional',
                arquivo: 'exercicios_microsoft_windows.json'
            }
        };

        async function carregarExercicios() {
            disciplinaAtual = sessionStorage.getItem('disciplinaSelecionada');
            if (!disciplinaAtual || !configDisciplina[disciplinaAtual]) { 
                window.location.href = 'index.html'; 
                return; 
            }
            
            aplicarEstilosCabecalho();
            
            const cfg = configDisciplina[disciplinaAtual];
            
            try {
                // Carrega o JSON específico da disciplina
                const response = await fetch(`dados/${cfg.arquivo}`);
                const data = await response.json();
                exerciciosData = data.exercicios;
                
                atualizarFiltros();
                renderizarExercicios();
                atualizarEstatisticas();
            } catch (error) {
                console.error('Erro ao carregar exercícios:', error);
                document.getElementById('listaExercicios').innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i> 
                            Erro ao carregar exercícios. Verifique se o arquivo ${cfg.arquivo} existe na pasta /dados/
                        </div>
                    </div>
                `;
                document.getElementById('estatisticas').innerHTML = 'Erro ao carregar estatísticas';
            }
        }

        function aplicarEstilosCabecalho() {
            const cfg = configDisciplina[disciplinaAtual];
            document.title = `Exercícios - ${cfg.nome}`;
            document.getElementById('nomeDisciplina').innerText = cfg.nome;
            document.getElementById('subtituloDisciplina').innerText = cfg.subtitulo;
            document.getElementById('cabecalhoPrincipal').style.color = cfg.cor;
            document.getElementById('iconeDisciplina').className = `fas ${cfg.icone}`;
        }

        function atualizarFiltros() {
            const trimestres = [...new Set(exerciciosData.map(e => e.trimestre))];
            const selectTrim = document.getElementById('filtroTrimestre');
            selectTrim.innerHTML = '<option value="todos">Todos os Trimestres</option>';
            trimestres.forEach(t => {
                selectTrim.innerHTML += `<option value="${t}">${t}</option>`;
            });
        }

        function renderizarExercicios() {
            const busca = document.getElementById('busca').value.toLowerCase();
            const trimestre = document.getElementById('filtroTrimestre').value;
            const nivel = document.getElementById('filtroNivel').value;
            
            let filtrados = exerciciosData.filter(ex => {
                const matchBusca = ex.titulo.toLowerCase().includes(busca);
                const matchTrim = trimestre === 'todos' || ex.trimestre === trimestre;
                const matchNivel = nivel === 'todos' || ex.nivel === nivel;
                return matchBusca && matchTrim && matchNivel;
            });
            
            const container = document.getElementById('listaExercicios');
            
            if (filtrados.length === 0) {
                container.innerHTML = `<div class="col-12"><div class="alert alert-info">Nenhum exercício encontrado.</div></div>`;
                return;
            }
            
            const cfg = configDisciplina[disciplinaAtual];
            
            container.innerHTML = filtrados.map(ex => `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card h-100 border shadow-sm">
                        <div class="card-header bg-white">
                            <h5 class="card-title fw-semibold mb-2" style="color: ${cfg.cor};">${ex.titulo}</h5>
                            <div>
                                <span class="badge" style="background-color: ${cfg.cor}; color:white;">${disciplinaAtual}</span>
                                <span class="badge bg-info">📅 ${ex.trimestre}</span>
                                <span class="badge ${ex.nivel === 'Iniciante' ? 'bg-success' : (ex.nivel === 'Intermediário' ? 'bg-warning text-dark' : 'bg-danger')}">⭐ ${ex.nivel}</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="small mb-2">
                                <strong>🎯 Objetivo:</strong><br>
                                ${ex.objetivo.substring(0, 120)}${ex.objetivo.length > 120 ? '...' : ''}
                            </p>
                            <p class="small mb-0">
                                <strong>📁 Arquivo:</strong> <code class="bg-light p-1">${ex.arquivos?.[0]?.nome || 'exercicio'}</code>
                            </p>
                        </div>
                        <div class="card-footer bg-white">
                            <button class="btn w-100" onclick="gerarEnunciado(${ex.id})">
                                <i class="fas fa-print me-2"></i>Gerar Enunciado / PDF
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function atualizarEstatisticas() {
            const total = exerciciosData.length;
            const niveis = [...new Set(exerciciosData.map(e => e.nivel))];
            document.getElementById('estatisticas').innerHTML = `
                <i class="fas fa-database me-2"></i>Total de exercícios: ${total} | 
                <i class="fas fa-chart-line me-2 ms-2"></i>Níveis: ${niveis.join(', ')}
            `;
        }

        function gerarEnunciado(id) {
            const exercicio = exerciciosData.find(e => e.id === id);
            if (exercicio) {
                sessionStorage.setItem('exercicioAtual', JSON.stringify(exercicio));
                window.open('template.html', '_blank');
            }
        }

        // Event Listeners
        document.getElementById('busca').addEventListener('input', renderizarExercicios);
        document.getElementById('filtroTrimestre').addEventListener('change', renderizarExercicios);
        document.getElementById('filtroNivel').addEventListener('change', renderizarExercicios);
        
        carregarExercicios();
    </script>
</body>
</html>
